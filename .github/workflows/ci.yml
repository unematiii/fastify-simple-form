name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: '18'
            fastify: '4'
          - node: '20'
            fastify: '4'
          - node: '20'
            fastify: '5'
          - node: '24'
            fastify: '5'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm install --no-save --package-lock=false fastify@${{ matrix.fastify }}
      - run: npm run lint
        if: matrix.node != '18'
      - run: npm test

